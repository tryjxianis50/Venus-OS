name: Bug report
description: Report a problem with Venus OS.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check whether this issue has already been reported.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps that lead to the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: Venus OS image or build
      description: Provide the release, image, or build identifier if available.
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Include the device model and relevant hardware details.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, tokens, and other sensitive information before posting.
      render: text
